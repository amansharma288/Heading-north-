name: Unzip File

on: [push, workflow_dispatch]

jobs:
  unzip:
    runs-on: ubuntu-latest  # must be ubuntu for unzip to work easily

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Unzip file
        run: |
          unzip -o myfile.zip -d ./extracted/
          
      # If unzip is missing (rare), install it first:
      # run: |
      #   sudo apt-get update
      #   sudo apt-get install -y unzip
      #   unzip -o myfile.zip -d ./extracted/
