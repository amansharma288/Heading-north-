name: Unzip ZIP to Root
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Show workspace (for debugging)
        run: ls -la

      - name: Unzip file into root
        run: |
          # update the filename if needed
          unzip -o myfile.zip -d .
          ls -la

      - name: Commit unzipped files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract zip files to root"
            git push
          fi
