{name: Unzip to root

on:
  workflow_dispatch:
  push:
    paths:
      - 'myfile.zip'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Unzip file into repository root
        run: unzip -o myfile.zip -d .

      - name: Delete old extracted folder
        run: rm -rf extracted

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Move files to repository root"
            git push
            fi}
